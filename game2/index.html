<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반포터 자이 키우기 🏢</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- ULTRA COMPACT HEADER -->
        <header id="game-header">
            <h1 class="game-title">반포터 자이 키우기 🏢</h1>
            
            <div class="stats-row">
                <div class="stat-box">자본금: <span id="depositDisplay">0</span></div>
                <div class="stat-box">월세 수익: <span id="totalRentDisplay">0</span></div>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">대출금: <span id="loanDisplay">0</span></div>
                <div class="stat-box">이자(<span id="interestRateDisplay">5</span>%): <span id="interestCostDisplay">0</span></div>
            </div>
            
            <div class="stats-row three-cols">
                <div class="stat-box">행복도: <span id="happinessDisplay">100</span></div>
                <div class="stat-box">내구도: <span id="stabilityDisplay">100</span></div>
                <div class="stat-box">눈물: <span id="tearsDisplay">0</span></div>
            </div>
            
            <div class="relics-strip">
                유물: <span id="relicsDisplay"></span>
            </div>
            
            <div class="tenant-row">
                <div class="tenant-info">
                    버스: <span id="busCountDisplay">0</span>/<span id="maxBusesDisplay">0</span> | 
                    거주자: <span id="tenantDisplay">0</span> <span id="tenantTrendDisplay">(-)</span>
                </div>
                <div class="rent-adjust">
                    임대료(<span id="rentPerTenantDisplay">0</span>)
                    <button id="btnRentDown" class="btn-small">-</button>
                    <button id="btnRentUp" class="btn-small">+</button>
                </div>
                <div class="tier-badge">등급: <span id="tierDisplay">F</span></div>
            </div>
        </header>

        <!-- GAME AREA -->
        <main id="game-main">
            <!-- Event Alert -->
            <div id="eventAlert" class="event-alert hidden">
                <span id="eventMessage"></span>
            </div>
            
            <!-- Tower -->
            <div id="towerContainer" class="tower-container">
                <!-- Tower floors will be generated here -->
            </div>
            
            <!-- Tabs -->
            <div class="tab-bar">
                <button id="tabBasic" class="tab-btn active">기본</button>
                <button id="tabUpgrade" class="tab-btn">시설</button>
                <button id="tabBank" class="tab-btn">은행</button>
                <button id="tabManager" class="tab-btn">관리</button>
                <button id="tabShop" class="tab-btn">암시장</button>
            </div>
            
            <!-- Control Panels -->
            <div class="panels-container">
                <!-- Panel Basic -->
                <div id="panelBasic" class="panel active">
                    <div class="btn-grid basic-grid">
                        <button id="btnManual" class="action-btn primary">수동 징수</button>
                        <button id="btnBuyBus" class="action-btn secondary">버스 매입 (<span id="busCostDisplay">50</span>)</button>
                        <button id="btnHeat" class="action-btn warning">난방 끄기</button>
                    </div>
                </div>
                
                <!-- Panel Upgrade -->
                <div id="panelUpgrade" class="panel hidden">
                    <div class="panel-section">
                        <h3>인프라 보강 <span class="score-badge">점수: <span id="infraScoreDisplay">0</span></span></h3>
                        <div class="btn-grid infra-grid">
                            <button id="btnInfraFire" class="action-btn"><span class="btn-title">소방</span> <span id="txtInfraFire" class="btn-desc">Lv.0</span></button>
                            <button id="btnInfraConv" class="action-btn"><span class="btn-title">편의</span> <span id="txtInfraConv" class="btn-desc">Lv.0</span></button>
                            <button id="btnInfraWater" class="action-btn"><span class="btn-title">수도</span> <span id="txtInfraWater" class="btn-desc">Lv.0</span></button>
                            <button id="btnInfraElec" class="action-btn"><span class="btn-title">전기</span> <span id="txtInfraElec" class="btn-desc">Lv.0</span></button>
                        </div>
                    </div>
                    
                    <div class="panel-section">
                        <h3>고급 시설</h3>
                        <div class="btn-grid facility-grid">
                            <button id="btnElevator" class="action-btn">엘리베이터</button>
                            <button id="btnCafe" class="action-btn">무인 카페</button>
                            <button id="btnSlide" class="action-btn">비상 슬라이드</button>
                            <button id="btnSubway" class="action-btn">지하철 연결</button>
                            <button id="btnHelipad" class="action-btn span-2">헬기장</button>
                        </div>
                    </div>
                </div>
                
                <!-- Panel Bank -->
                <div id="panelBank" class="panel hidden">
                    <div class="btn-grid bank-grid">
                        <button id="btnLoan" class="action-btn danger">대출 받기</button>
                        <button id="btnRepay" class="action-btn success">일부 상환</button>
                        <button id="btnRepayAll" class="action-btn success">전액 상환</button>
                        <button id="btnZoning" class="action-btn warning">용도 변경</button>
                    </div>
                </div>
                
                <!-- Panel Manager -->
                <div id="panelManager" class="panel hidden">
                    <div class="btn-grid manager-grid">
                        <button id="btnMgrThug" class="action-btn">용역 고용</button>
                        <button id="btnMgrAcc" class="action-btn">회계사 고용</button>
                        <button id="btnMgrPr" class="action-btn">PR 전문가</button>
                    </div>
                </div>
                
                <!-- Panel Shop -->
                <div id="panelShop" class="panel hidden">
                    <div id="shopTimer" class="shop-timer">암시장 닫힘</div>
                    <div id="shopItems" class="shop-items-container">
                        <!-- Shop items generated here -->
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Footer / Meta -->
        <footer id="game-footer">
            <button id="btnAchievements" class="btn-small outline">업적 확인</button>
            <a href="index.html" class="back-link">타이틀로 돌아가기</a>
        </footer>
    </div>
    
    <!-- MODALS -->
    
    <!-- Achievements Modal -->
    <div id="achievementModal" class="modal hidden">
        <div class="modal-content">
            <h2>달성한 업적</h2>
            <div id="achievementList" class="achievement-list"></div>
            <button class="action-btn close-modal" onclick="document.getElementById('achievementModal').classList.add('hidden')">닫기</button>
        </div>
    </div>
    
    <!-- Choice Modal (Events) -->
    <div id="choiceModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="choiceTitle">이벤트</h2>
            <p id="choiceDesc">무엇을 하시겠습니까?</p>
            <div id="choiceButtons" class="choice-buttons-container"></div>
        </div>
    </div>
    
    <!-- Rebirth Modal -->
    <div id="rebirthModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="rebirthTitle">환생</h2>
            <div id="rebirthStats" class="rebirth-stats"></div>
            <div class="legacy-info">
                보유 유산: <span id="legacyPointsDisplay">0</span>
            </div>
            <div id="legacyShop" class="legacy-shop-grid"></div>
            <button id="btnRestartRebirth" class="action-btn danger span-full">새로운 시작</button>
            <button class="action-btn secondary close-modal" onclick="document.getElementById('rebirthModal').classList.add('hidden')">취소</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
