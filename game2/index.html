<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반포터 자이 키우기 - 매운맛 부동산 에디션</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        
        <header class="header">
            <h1>반포터 자이 키우기 🏢</h1>
            <div class="stats-row">
                <span>자본금: <span id="depositDisplay" class="dark-stat">0</span> 💰</span>
                <span>월세 수익: <span id="totalRentDisplay" class="dark-stat">0</span> 💰/s</span>
            </div>
            <div class="stats-row bank-row">
                <span>대출금: <span id="loanDisplay" class="warning-text">0</span> 💰</span>
                <span>기준 금리: <span id="interestRateDisplay" class="warning-text">5.0</span>% (이자 <span id="interestCostDisplay">0</span>/s)</span>
            </div>
            
            <div class="relics-container" id="relicsDisplay">
                <span style="color: #7f8c8d; font-size: 0.8rem;">보유 유물 없음</span>
            </div>
            
            <div class="tenant-control">
                <div class="stats-row" style="margin-bottom: 5px;">
                    <span>입주민: <span id="tenantDisplay" class="dark-stat">0/0</span> 🧑</span>
                    <span>건물 규모: <span id="busCountDisplay" class="dark-stat">1</span> / <span id="maxBusesDisplay">5</span> 대 (용적률)</span>
                </div>
                
                <div class="rent-adjuster" style="margin-bottom: 5px;">
                    <span>인당 월세: 
                        <button class="small-btn" id="btnRentDown">-</button>
                        <span id="rentPerTenantDisplay" class="dark-stat">2</span>
                        <button class="small-btn" id="btnRentUp">+</button>
                    </span>
                    <span style="font-size: 0.8rem; opacity: 0.8;">(선호도: <span id="attractDisplay" class="dark-stat">50</span>%)</span>
                </div>
            </div>
            <div class="meters-row">
                <span>행복도: <span id="happinessDisplay" class="dark-stat">100</span>%</span>
                <span>내구도: <span id="stabilityDisplay" class="dark-stat">100</span>%</span>
                <span>눈물: <span id="tearsDisplay" class="dark-stat">0</span></span>
            </div>
        </header>

        <!-- 이벤트 전용 공간 (어떤 UI도 가리지 않음) -->
        <div id="eventAlert" class="event-alert hidden">
            <span id="eventMessage" class="event-message">이벤트 내용이 여기에 표시됩니다.</span>
        </div>

        <main class="game-area">
            <div class="tower-container" id="towerContainer">
                <!-- Buses will be injected here -->
            </div>
            <div class="ground"></div>
        </main>

        <div class="control-tabs">
            <button class="tab-btn active" id="tabBasic">기본 관리</button>
            <button class="tab-btn" id="tabUpgrade">시설 투자</button>
            <button class="tab-btn" id="tabBank">🏦 은행</button>
            <button class="tab-btn" id="tabShop">🛒 암시장</button>
        </div>

        <!-- 기본 관리 탭 -->
        <nav class="controls" id="panelBasic">
            <button class="btn btn-action" id="btnManual">👆 수동 징수<br>(자본금 +)</button>
            <button class="btn btn-primary" id="btnBuyBus">🚌 버스 매입<br>(비용: <span id="busCostDisplay">50</span>)</button>
            <button class="btn btn-warning" id="btnRepair">🛠️ 철근 보수<br>(비용 -20)</button>
            <button class="btn btn-info" id="btnPizza">🍕 피자 파티<br>(비용 -30)</button>
        </nav>

        <!-- 시설 투자 탭 -->
        <nav class="controls hidden" id="panelUpgrade">
            <button class="btn btn-dark" id="btnElevator">🏗️ 완강기 설치<br>(비용: 300 | 선호도 +20)</button>
            <button class="btn btn-warning" id="btnCafe">☕ 1층 카페테리아<br>(비용: 500 | 선호도 +30)</button>
            <button class="btn btn-primary" id="btnSlide">🪂 낙하산 미끄럼틀<br>(비용: 1500 | 이탈 20% 방어)</button>
            <button class="btn btn-evil" id="btnSubway">🚇 지하철역 직통<br>(비용: 5000 | 월세 상한 150)</button>
            <button class="btn btn-info" id="btnHelipad" style="grid-column: span 2;">🚁 옥상 헬기장 (수용 인원 2배 증가)<br>(비용: 15000)</button>
            <div style="grid-column: span 2; font-size: 0.8rem; color: #f1c40f; text-align: center; border: 1px dashed #f1c40f; padding: 5px;">
                💡 각 층의 리모델링은 화면의 <b>버스(뱃지)를 직접 클릭</b>하여 진행하세요!
            </div>
            <button class="btn btn-evil" id="btnHeat">🥶 난방 끄기<br>(눈물 생산기)</button>
        </nav>

        <!-- 은행/부동산 탭 -->
        <nav class="controls hidden" id="panelBank">
            <button class="btn btn-evil" id="btnLoan">💸 자산 담보 대출</button>
            <button class="btn btn-info" id="btnRepay">💵 일부 상환</button>
            <button class="btn btn-info" id="btnRepayAll" style="grid-column: span 2; background: #2980b9;">💸 영혼의 전액 상환</button>
            <button class="btn btn-dark" id="btnZoning" style="grid-column: span 2;">🏗️ 토지 용도 변경 로비<br>(용적률 상한 +5대 | 비용: 1000)</button>
        </nav>
        
        <!-- 암시장 탭 -->
        <nav class="controls hidden" id="panelShop">
            <div style="display: flex; flex-direction: column; gap: 5px; grid-column: span 2;">
                <div style="text-align: center; font-size: 0.85rem; color: #f1c40f; margin-bottom: 5px;">다음 상품 입고까지: <span id="shopTimer">30</span>초</div>
                <div id="shopItems" style="display: flex; flex-direction: column; gap: 5px;">
                    <!-- Shop items will be injected here -->
                </div>
            </div>
        </nav>
        
        <a href="../index.html" class="back-link">파산 선언 (메인으로)</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
