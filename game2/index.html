<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반포터 자이 키우기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>반포터 자이 키우기</h1>
            <div class="stats-row">
                <span>💰 보증금: <span id="depositDisplay">0</span></span>
                <span>💸 초당 월세: <span id="rentDisplay">0</span></span>
                <span class="dark-stat">💧 눈물: <span id="tearsDisplay">0</span></span>
            </div>
            <div class="meters-row">
                <span>내구도: <span id="stabilityDisplay">100</span>%</span>
                <span>행복도: <span id="happinessDisplay">100</span>%</span>
            </div>
        </header>

        <main class="game-area">
            <div class="tower-container" id="towerContainer">
            </div>
            <div class="ground"></div>
        </main>

        <footer class="controls">
            <button id="btnManual" class="btn btn-action">👉 수동 수금</button>
            <button id="btnBuyBus" class="btn btn-primary">🚌 버스 매입 (<span id="busCostDisplay">50</span>)</button>
            <button id="btnRepair" class="btn btn-warning">🛠️ 철근 보수 (20)</button>
            <button id="btnPizza" class="btn btn-info">🍕 피자 회유 (30)</button>
            <button id="btnHeat" class="btn btn-evil">🥶 난방 끄기 (눈물)</button>
            <button id="btnLobby" class="btn btn-dark">😈 로비 (눈물 100)</button>
        </footer>
    </div>
    <a href="../index.html" class="back-link">메인으로 돌아가기</a>
    <script src="app.js"></script>
</body>
</html>
