<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분노 테스터</title>
    <link rel="stylesheet" href="style.css">
    <!-- 데이터 분리 로드 -->
    <script src="data.js"></script>
</head>
<body>
    <div class="game-container">
        
        <!-- 테마 선택 화면 -->
        <div id="themeScreen" class="screen active">
            <header class="header">
                <h1>분노 테스터</h1>
                <p>오늘 나의 빡침 주제는?</p>
            </header>
            <div class="theme-list" id="themeList">
                <!-- JS에서 동적 생성 -->
            </div>
            <a href="../index.html" class="back-link">그만하기 (메인으로)</a>
        </div>

        <!-- 인게임 화면 -->
        <div id="gameScreen" class="screen hidden">
            <!-- 방향 안내 인디케이터 (화면 양옆) -->
            <div id="leftIndicator" class="side-indicator left-indicator">
                <div class="indicator-icon">⬅️</div>
                <div class="indicator-text">참는다</div>
                <div class="indicator-score">0점</div>
            </div>
            <div id="rightIndicator" class="side-indicator right-indicator">
                <div class="indicator-icon">➡️</div>
                <div class="indicator-text">급발진</div>
                <div class="indicator-score">100점</div>
            </div>

            <header class="header">
                <h1 id="inGameTitle">테마 제목</h1>
                <p>카드를 꾹 잡고 양옆으로 던지세요!</p>
            </header>

            <main class="swiper-container" id="swiperContainer">
                <!-- Cards will be injected here -->
            </main>
        </div>

        <!-- 결과 화면 -->
        <div id="resultScreen" class="screen hidden">
            <div class="emoji-hero" id="resultEmoji">🧘‍♂️</div>
            <h2 id="resultTitle">득도한 생불</h2>
            <p id="resultDesc">하위 5%! 해탈하셨습니다.</p>
            <div class="stats-box">
                <p>내 평균 빡침 지수: <br><strong id="resultScore" class="score-highlight">0점</strong></p>
            </div>
            <button class="btn btn-primary" onclick="goToThemeScreen()">다른 테마 하기</button>
            <a href="../index.html" class="back-link">그만하기 (메인으로)</a>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
