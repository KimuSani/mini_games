<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분노 테스터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>분노 테스터</h1>
            <p>⬅️ 참는다 (0점) &nbsp;&nbsp;&nbsp;&nbsp; 급발진 (100점) ➡️</p>
            <p style="font-size: 0.8rem; color: #747d8c; margin-top: 5px;">(카드를 마우스로 잡고 좌우로 던지세요!)</p>
        </header>

        <main class="swiper-container" id="swiperContainer">
            <!-- Cards will be injected here -->
        </main>

        <div class="result-screen hidden" id="resultScreen">
            <div class="emoji-hero" id="resultEmoji">🧘‍♂️</div>
            <h2 id="resultTitle">득도한 생불</h2>
            <p id="resultDesc">하위 5%! 해탈하셨습니다.</p>
            <div class="stats-box">
                <p>내 평균 빡침 지수: <strong id="resultScore" style="color: #ff4757;">0점</strong></p>
                <p>전국 평균: 68점</p>
            </div>
            <button class="btn btn-secondary" onclick="location.reload()">다시 하기</button>
        </div>

        <a href="../index.html" class="back-link">그만하기 (메인으로)</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
